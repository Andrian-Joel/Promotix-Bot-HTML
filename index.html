<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotix | Legal</title>
    <link rel="icon" href="tab-icon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #050505;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            padding: 40px 24px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 18px rgba(255,255,255,0.15));
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: #888;
            font-size: 1.05rem;
            margin-bottom: 40px;
        }

        .banner-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #222;
            margin-bottom: 48px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .banner {
            width: 100%;
            display: block;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 360px;
            margin: 0 auto;
        }

        .btn {
            display: block;
            padding: 16px 28px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #1a1a1a;
            border-color: #444;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.05);
        }

        .btn.primary {
            background: linear-gradient(135deg, #1f1f1f, #141414);
            border-color: #333;
        }

        footer {
            margin-top: 60px;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="icon.png" alt="Promotix Logo" class="logo">
        <h1>Promotix</h1>
        <p class="tagline">Manage Ranks. Build Leaders. Stay Organized.</p>

        <div class="banner-wrapper">
            <img src="banner.png" alt="Promotix Banner" class="banner">
        </div>

        <div class="buttons">
            <a href="tos.html" class="btn primary">Terms of Service</a>
            <a href="privacy.html" class="btn">Privacy Policy</a>
        </div>

        <footer>
            © 2026 Promotix. All rights reserved.
        </footer>
    </div>
</body>
</html>
